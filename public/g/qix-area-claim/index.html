<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#ffd23f">
  <meta name="description" content="Qix Area Claim — playable demo of the Qix Area Claim primitive.">

  <title>Qix Area Claim</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png" sizes="180x180">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Qix Area Claim">

  <link rel="preload" as="style" href="style.css?v=0.1.2">
  <link rel="stylesheet" href="style.css?v=0.1.2">
</head>
<body>
  <header class="toolbar" role="banner">
    <a href="../../" class="tbtn back" aria-label="Back to catalog">←</a>
    <span class="brand">Qix Area Claim <span class="ver">v0.1.2</span><span class="build" title="hub build identity — matches the SHA on the hub footer">__BUILD_SHA__ · __BUILD_DATE__</span></span>
    <span class="spacer"></span>
    <button id="btn-install" class="tbtn" hidden>Install</button>
    <button id="btn-fullscreen" class="tbtn" aria-label="Fullscreen">⛶</button>
  </header>

  <p id="ios-hint" class="ios-hint" hidden>
    Install: tap Share, then <strong>Add to Home Screen</strong>.
    <button id="ios-hint-close" aria-label="Dismiss">×</button>
  </p>

  <main id="stage" class="stage">
    <canvas id="canvas" aria-label="Qix Area Claim playfield"></canvas>
    <div id="hud" class="hud"></div>
  </main>

  <nav class="touch-bar" aria-label="Game controls">
    <div class="cluster dpad">
      <button class="tb-btn" data-act="up" aria-label="Up" type="button">▲</button>
      <button class="tb-btn" data-act="left" aria-label="Left" type="button">◀</button>
      <button class="tb-btn" data-act="down" aria-label="Down" type="button">▼</button>
      <button class="tb-btn" data-act="right" aria-label="Right" type="button">▶</button>
    </div>
    <div class="cluster">
      <button class="tb-btn" data-act="draw" aria-label="Draw" type="button">DRAW</button>
    </div>
  </nav>

  <script type="module" src="game.js?v=0.1.2"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js', { scope: './' }).catch(()=>{});
      });
    }
  </script>
</body>
</html>
